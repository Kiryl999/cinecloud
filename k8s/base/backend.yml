# Stateless: any replica can serve any request, and live seat-map updates
# reach all of them through Redis pub/sub.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
  annotations:
    # after the migration (see migrate-job.yml)
    argocd.argoproj.io/sync-wave: "2"
spec:
  # No replicas: the autoscaler below sets them. A number here would have
  # Argo CD put it back after every change the autoscaler makes.
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      # the app never talks to the Kubernetes API, so it gets no token for it
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # 5 s preStop pause + up to 10 s for open seat-map streams
      # (--timeout-graceful-shutdown in the Dockerfile) + closing the pools
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: ghcr.io/kiryl999/cinecloud/backend
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          # see app/api/health.py for what each probe checks and why
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            # above READINESS_TIMEOUT_SECONDS, so a slow database reads as
            # "not ready" and not as a probe that never answered
            timeoutSeconds: 3
          lifecycle:
            # SIGTERM and the removal from the gateway's endpoints happen at
            # the same time; the pause keeps the pod answering until the
            # gateway has stopped sending it requests
            preStop:
              sleep:
                seconds: 5
          resources:
            # Half a core, as request and as limit: the budget the autoscaler
            # measures against, and a ceiling that keeps an overloaded backend
            # from taking the CPU PostgreSQL, the gateway and Kubernetes itself
            # need - more load means more pods, not bigger ones.
            requests:
              cpu: 500m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # the only writable path, for temporary files such as large
            # form uploads
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# More backend pods while they are busy, fewer once they are not. The
# metrics-server supplies the CPU usage (see k8s/README.md).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
  annotations:
    # with the backend it scales
    argocd.argoproj.io/sync-wave: "2"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  # two, so that a pod can fail or be replaced without an outage
  minReplicas: 2
  # Bound by PostgreSQL: a pod opens up to 15 connections (pool of 5 plus 10
  # overflow, see app/core/config.py), so four pods take at most 60 of the
  # server's 100 and leave room for Keycloak and the migration.
  maxReplicas: 4
  metrics:
    # Another pod once the pods use more than 70 % of their CPU request on
    # average; the 30 % left take the rising load while that pod starts. Fewer
    # pods only after five minutes below it, the default, so a short lull
    # does not undo the scaling.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
