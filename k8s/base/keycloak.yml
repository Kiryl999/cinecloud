# Signs the cinema admins in and issues their tokens; the backend only checks
# them against Keycloak's public keys. The realm - client, password and
# passkey policy - comes from cinecloud-realm.json, imported on the first
# start. Later changes to that file do not touch a realm that already exists.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
spec:
  # More replicas would have to form a cluster to share their session caches;
  # a restart costs signed-in admins nothing, their tokens stay valid
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Keycloak creates its tables but not the database for them. Checks
        # first, so it also runs against a server that has one already; until
        # PostgreSQL accepts connections it fails and is retried.
        - name: create-database
          image: postgres:16-alpine
          # connects to the maintenance database "postgres", which always exists
          command:
            - sh
            - -c
            - |
              export PGHOST="$KC_DB_URL_HOST" PGUSER="$KC_DB_USERNAME" PGDATABASE=postgres
              psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$KC_DB_URL_DATABASE'" | grep -q 1 \
                || psql -c "CREATE DATABASE \"$KC_DB_URL_DATABASE\""
          envFrom:
            - configMapRef:
                name: keycloak-config
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: KC_DB_PASSWORD
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            # the postgres user of the alpine image
            runAsUser: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.1
          # `start` first builds the server for the configured database,
          # which adds about 20 s; an image prepared with `kc.sh build`
          # would skip that
          args: ["start", "--import-realm"]
          ports:
            - name: http
              containerPort: 8080
            # health checks, kept off the port the gateway forwards to
            - name: management
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: keycloak-config
            - secretRef:
                name: keycloak-secrets
          startupProbe:
            httpGet:
              path: /auth/health/started
              port: management
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /auth/health/live
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /auth/health/ready
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            # no readOnlyRootFilesystem: the build at start writes into the
            # image's lib directory
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
