fullnameOverride: monitoring

kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

prometheusOperator:
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 24Mi
      limits:
        memory: 64Mi

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    externalUrl: http://localhost:9090
    retention: 15d
    retentionSize: 4GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

alertmanager:
  config:
    route:
      group_by: [alertname, namespace]
      receiver: mail
      routes:
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
    receivers:
      - name: "null"
      - name: mail
        email_configs:
          - to: ops@cinecloud.local
            from: alerts@cinecloud.local
            smarthost: mailpit.cinecloud.svc.cluster.local:1025
            require_tls: false
            send_resolved: true
  alertmanagerSpec:
    externalUrl: http://localhost:9093
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

grafana:
  adminPassword: local-only
  defaultDashboardsTimezone: browser
  testFramework:
    enabled: false
  grafana.ini:
    analytics:
      check_for_updates: false
      reporting_enabled: false
    dashboards:
      default_home_dashboard_path: /tmp/dashboards/cinecloud.json
  resources:
    requests:
      cpu: 50m
      memory: 320Mi
    limits:
      memory: 512Mi
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 160Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 64Mi
