apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cinecloud
spec:
  groups:
    - name: cinecloud
      rules:
        - alert: CineCloudComponentDown
          expr: |
            max by (namespace, deployment) (kube_deployment_status_replicas_available{namespace="cinecloud"}) == 0
            and on (namespace, deployment)
            max by (namespace, deployment) (kube_deployment_spec_replicas{namespace="cinecloud"}) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "No pod of {{ $labels.deployment }} is ready"
            description: "{{ $labels.deployment }} in {{ $labels.namespace }} has had no ready pod for 2 minutes."
        - alert: CineCloudComponentDown
          expr: |
            max by (namespace, statefulset) (kube_statefulset_status_replicas_ready{namespace="cinecloud"}) == 0
            and on (namespace, statefulset)
            max by (namespace, statefulset) (kube_statefulset_replicas{namespace="cinecloud"}) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "No pod of {{ $labels.statefulset }} is ready"
            description: "{{ $labels.statefulset }} in {{ $labels.namespace }} has had no ready pod for 2 minutes."

        - alert: CineCloudHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="cinecloud", job="backend", status=~"5.."}[5m]))
              / sum(rate(http_requests_total{namespace="cinecloud", job="backend"}[5m]))
              > 0.05
            and
            sum(increase(http_requests_total{namespace="cinecloud", job="backend", status=~"5.."}[5m])) >= 5
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $value | humanizePercentage }} of API requests fail"
            description: "More than 5 % of the backend's responses have been server errors (5xx) for 5 minutes."


        - alert: CineCloudSlowResponses
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_highr_seconds_bucket{namespace="cinecloud", job="backend"}[5m]))
            ) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "API requests are slow"
            description: "For 10 minutes, 1 in 20 API requests has taken longer than a second. Right now the slowest 5 % take {{ $value | humanizeDuration }} or more."

        - alert: CineCloudRedisFailing
          expr: |
            sum(increase(cinecloud_redis_failures_total{namespace="cinecloud", job="backend"}[5m])) > 2
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Redis is failing, guests cannot reserve seats"
            description: "About {{ $value | humanize }} Redis operations of the backend failed in the last 5 minutes."

        - alert: CineCloudBookingMailsFailing
          expr: |
            sum(increase(cinecloud_booking_mails_total{namespace="cinecloud", job="backend", outcome="failed"}[15m])) > 0
          labels:
            severity: warning
          annotations:
            summary: "Booking confirmations are not being sent"
            description: "At least one booking confirmation could not be handed to the mail server in the last 15 minutes. The booking is saved; the backend log names its reference."

    - name: argocd
      rules:
        - alert: ArgoCDAppOutOfSync
          expr: |
            max by (name) (argocd_app_info{sync_status="OutOfSync"}) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD app {{ $labels.name }} is out of sync with git"
            description: "{{ $labels.name }} has differed from main for 15 minutes. The Argo CD UI shows the last sync and the diff."
        - alert: ArgoCDAppUnhealthy
          expr: |
            max by (name, health_status) (argocd_app_info{health_status=~"Degraded|Missing"}) == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD app {{ $labels.name }} is {{ $labels.health_status }}"
            description: "Argo CD has counted {{ $labels.name }} as {{ $labels.health_status }} for 10 minutes. Its UI shows which resource."
