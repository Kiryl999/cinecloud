apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cinecloud-backend
spec:
  namespaceSelector:
    matchNames: [cinecloud]
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/part-of: cinecloud
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd
spec:
  namespaceSelector:
    matchNames: [argocd]
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-metrics
  endpoints:
    - port: metrics
