apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# What guests use, at http://localhost. It runs released versions only: CI
# writes the tag of each release to images/ (see README.md).

namespace: cinecloud-production

resources:
  - ../../base

configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - OIDC_ISSUER=http://localhost/auth/realms/cinecloud
  - name: keycloak-config
    behavior: merge
    literals:
      # the address in the browser, which Keycloak also writes into every
      # token - localhost rather than 127.0.0.1, which passkeys refuse
      - KC_HOSTNAME=http://localhost/auth

components:
  - ../../components/minikube
  - images
