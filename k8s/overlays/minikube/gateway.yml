# The entry point of the cluster. Envoy Gateway (k8s/cluster/minikube) runs an
# Envoy proxy for it behind a LoadBalancer service, which `minikube tunnel`
# puts on 127.0.0.1.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cinecloud
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
