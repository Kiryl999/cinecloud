apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Installed once per cluster, before the app: the Gateway API resource types
# and Envoy Gateway, which implements them. No namespace is set here - the
# GatewayClass belongs to the whole cluster, and Envoy Gateway brings its own.
# Apply with --server-side: the CRDs are too large for a client-side apply.

resources:
  - https://github.com/envoyproxy/gateway/releases/download/v1.9.3/install.yaml
  - gatewayclass.yml
