apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Installed once per cluster, before the app: the Gateway API resource types
# and Envoy Gateway, which implements them; Argo CD, which deploys the app;
# and the metrics-server, whose CPU figures the backend's autoscaler goes by.
# No namespace is set here - the GatewayClass belongs to the whole cluster,
# Envoy Gateway and the metrics-server bring their own, and argocd/ sets its
# own.
# Apply with --server-side: the CRDs are too large for a client-side apply.

resources:
  - https://github.com/envoyproxy/gateway/releases/download/v1.9.3/install.yaml
  - gatewayclass.yml
  - argocd
  # Not minikube's addon, which measures once a minute: this one measures
  # every 15 seconds, so the autoscaler notices a rush that much sooner.
  - https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.1/components.yaml

patches:
  # minikube's kubelet serves a certificate no authority has signed
  - target:
      kind: Deployment
      name: metrics-server
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
