# Only for the local cluster: a mail server that delivers nothing. It takes
# whatever the backend sends and shows it at /mail of its environment, so a
# booking confirmation can be read without a mail leaving this machine. An
# environment with real guests sends through a relay instead, see SMTP_* in
# backend/app/core/config.py.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # the image would run as root; nobody is enough
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.32.0
          env:
            # the web UI below /mail, where the gateway routes it
            - name: MP_WEBROOT
              value: /mail/
            # Messages are kept in a file in /tmp and go with the pod. Not
            # worth a volume: they are copies of confirmations already logged.
            - name: MP_MAX_MESSAGES
              value: "500"
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          readinessProbe:
            httpGet:
              path: /mail/readyz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
spec:
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
---
# Beside the app's own route (base/httproute.yml): the longer prefix /mail
# wins over its catch-all /.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mailpit
  annotations:
    # with the app's route
    argocd.argoproj.io/sync-wave: "3"
spec:
  parentRefs:
    - name: cinecloud
      namespace: envoy-gateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mail
      backendRefs:
        - name: mailpit
          port: 8025
