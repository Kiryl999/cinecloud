apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# What every environment on the local cluster gets: PostgreSQL, Redis and a
# mail catcher of its own inside the cluster, and fixed passwords.

resources:
  - postgres.yml
  - redis.yml
  - mailpit.yml

configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - REDIS_URL=redis://redis:6379/0
      # booking confirmations end up in Mailpit, see mailpit.yml
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
  - name: keycloak-config
    behavior: merge
    literals:
      - KC_DB_URL_HOST=postgres
      - KC_DB_USERNAME=cinecloud

# Fixed passwords, in plain text and public with the repo, so that the cluster
# comes up without a step by hand. Acceptable only because nothing but this
# machine reaches it; an environment others can reach keeps its secrets out
# of git.
secretGenerator:
  - name: postgres-secrets
    literals:
      # read only when PostgreSQL sets up an empty volume: a change here does
      # not reach a database that already exists
      - POSTGRES_PASSWORD=local-only
  - name: backend-secrets
    literals:
      - DATABASE_URL=postgresql+asyncpg://cinecloud:local-only@postgres:5432/cinecloud
  - name: keycloak-secrets
    literals:
      # Keycloak keeps its data in its own database on the same server
      - KC_DB_PASSWORD=local-only
      # the admin console, see k8s/README.md
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
