# Replaces the base image's default server. Only static files are served here:
# requests to /api are routed to the backend by the ingress.
server {
    listen 8080;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Vite puts a content hash into every file name under /assets/: a changed
    # file always gets a new name, so browsers may keep each one for good.
    # A missing file is a 404, not index.html, or the browser would try to run
    # HTML as JavaScript.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Routes such as /cinemas/:slug exist only in the React router, so every
    # unknown path gets index.html. Browsers must check it on every visit
    # (no-cache), or after a deploy they would keep asking for old asset names.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
