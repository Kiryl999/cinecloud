name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

# One run per branch at a time: two runs side by side would race for the next
# version or for the commit with the image tags
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cinecloud
          POSTGRES_PASSWORD: cinecloud
          POSTGRES_DB: cinecloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinecloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://cinecloud:cinecloud@localhost:5432/cinecloud
      REDIS_URL: redis://localhost:6379/0
      # never contacted: the tests sign their tokens with a key of their own
      OIDC_ISSUER: http://localhost:8080/auth/realms/cinecloud

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check migrations
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Run tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # What Argo CD deploys has to build. Nothing gets to staging or production
  # with an overlay that does not.
  manifests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build the overlays
        run: |
          for directory in k8s/cluster/* k8s/overlays/* k8s/monitoring; do
            echo "$directory"
            kustomize build "$directory" > /dev/null
          done

  # The alert rules against the cases in k8s/monitoring/alerts.test.yml, and
  # the dashboards against JSON syntax. Argo CD deploys k8s/ from main either
  # way; this only tells when a push broke them.
  monitoring:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # promtool reads plain rule files, which a PrometheusRule wraps in its
      # spec. yq comes with the runner, promtool with the image of the
      # Prometheus version the chart deploys.
      - name: Test the alert rules
        run: |
          mkdir -p "$RUNNER_TEMP/rules"
          yq '.spec' k8s/monitoring/alerts.yml > "$RUNNER_TEMP/rules/alerts.yml"
          cp k8s/monitoring/alerts.test.yml "$RUNNER_TEMP/rules/"
          docker run --rm -v "$RUNNER_TEMP/rules:/rules" -w /rules --entrypoint promtool \
            quay.io/prometheus/prometheus:v3.16.0 test rules alerts.test.yml

      - name: Check the dashboards
        run: jq empty k8s/monitoring/dashboards/*.json

  # The AWS target architecture: formatted, and a configuration Terraform
  # accepts. Without an account: nothing is planned against AWS here.
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.7

      - name: Check the format
        run: terraform fmt -check -diff

      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

  loadtest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Compiles each scenario and works out its options, as k6 does before a
      # run, without sending a request: a mistake shows here, not minutes
      # into a test.
      - name: Check the load tests
        run: |
          for scenario in loadtest/*.js; do
            docker run --rm -v "$PWD/loadtest:/scripts:ro" grafana/k6:2.3.0 \
              inspect "/scripts/$(basename "$scenario")" > /dev/null
          done



  # develop: builds both images once the checks pass and pushes them to ghcr.io
  images:
    needs: [backend, frontend, manifests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # for staging, which writes the same tag into its overlay
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v7

      - name: Compute image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # emulates arm64 for the RUN steps of the backend image
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kiryl999/cinecloud/backend:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push the frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kiryl999/cinecloud/frontend:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # develop: has staging run the new images. Argo CD follows develop for
  # staging, so their tag is committed to its overlay there.
  staging:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.images.outputs.tag }}

    steps:
      - uses: actions/checkout@v7

      - name: Point staging at the new images
        working-directory: k8s/overlays/staging/images
        run: |
          kustomize edit set image \
            "ghcr.io/kiryl999/cinecloud/backend:$TAG" \
            "ghcr.io/kiryl999/cinecloud/frontend:$TAG"

      - name: Commit the new tags
        run: |
          git fetch origin develop
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/develop)" ]; then
            echo "::notice::develop moved on during the build; its own run sets the tags"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(staging): images $TAG"
          git push origin HEAD:develop \
            || echo "::notice::develop moved on during the build; its own run sets the tags"

  candidate:
    needs: [backend, frontend, manifests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.find.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find the images staging runs
        id: find
        run: |
          tag=$(yq '.images[0].newTag' k8s/overlays/staging/images/kustomization.yml)
          if ! git diff --quiet "${tag#sha-}" HEAD -- backend frontend; then
            echo "::error::staging runs $tag, which is not the code of this commit"
            exit 1
          fi
          for image in backend frontend; do
            if ! docker buildx imagetools inspect "ghcr.io/kiryl999/cinecloud/$image:$tag" > /dev/null; then
              echo "::error::no image $image:$tag"
              exit 1
            fi
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Release
        run: npx -p semantic-release@25.0.9 -p conventional-changelog-conventionalcommits@9.3.1 semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Read the version of this commit
        id: version
        run: echo "version=$(git tag --points-at HEAD --list 'v*' | head -n 1)" >> "$GITHUB_OUTPUT"
  production:
    needs: [candidate, release]
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      CANDIDATE: ${{ needs.candidate.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}

    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the images with the version
        run: |
          for image in backend frontend; do
            docker buildx imagetools create \
              --tag "ghcr.io/kiryl999/cinecloud/$image:$VERSION" \
              "ghcr.io/kiryl999/cinecloud/$image:$CANDIDATE"
          done

      # with the history, to move develop along below
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Point production at the version
        working-directory: k8s/overlays/production/images
        run: |
          kustomize edit set image \
            "ghcr.io/kiryl999/cinecloud/backend:$VERSION" \
            "ghcr.io/kiryl999/cinecloud/frontend:$VERSION"

      # Pushed with the token of this workflow, the commit starts no run of
      # its own.
      - name: Commit the version
        run: |
          if git diff --quiet; then
            echo "::notice::production already runs $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(production): $VERSION"
          git push origin HEAD:main
          # develop gets the merge and this commit as well, so that it holds
          # everything main does - unless it has moved on meanwhile
          git push origin HEAD:develop \
            || echo "::notice::develop has moved on; it gets these commits with the next release"
