name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per branch at a time: two runs on main side by side would race for
# the next version and for the commit with the image tags
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cinecloud
          POSTGRES_PASSWORD: cinecloud
          POSTGRES_DB: cinecloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinecloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://cinecloud:cinecloud@localhost:5432/cinecloud
      REDIS_URL: redis://localhost:6379/0
      # never contacted: the tests sign their tokens with a key of their own
      OIDC_ISSUER: http://localhost:8080/auth/realms/cinecloud

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check migrations
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Run tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Builds both images once the tests pass on main and pushes them to ghcr.io
  images:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # for deploy, which writes the same tag into the overlay
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v7

      - name: Compute image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # emulates arm64 for the RUN steps of the backend image
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kiryl999/cinecloud/backend:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push the frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kiryl999/cinecloud/frontend:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # Tags a new version when the commits since the last one call for it - fix a
  # patch, feat a minor, a breaking change a major - and publishes its release
  # notes. Runs before deploy: semantic-release only releases while main is
  # still the commit it looks at.
  release:
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # the whole history with its tags, to find the last version and the
      # commits since
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # the plugins and their order are in .releaserc.json; the preset is not
      # bundled with semantic-release. Version 9 is the one the release notes
      # generator is tested with - 10 needs a newer changelog writer than it has.
      - name: Release
        run: npx -p semantic-release@25.0.9 -p conventional-changelog-conventionalcommits@9.3.1 semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Points the minikube overlay at the new images
  deploy:
    needs: [images, release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Point the minikube overlay at the new images
        working-directory: k8s/overlays/minikube/images
        run: |
          kustomize edit set image \
            ghcr.io/kiryl999/cinecloud/backend:${{ needs.images.outputs.tag }} \
            ghcr.io/kiryl999/cinecloud/frontend:${{ needs.images.outputs.tag }}

      # A newer push to main has a run of its own, which sets newer tags; this
      # one leaves the overlay alone rather than roll it back
      - name: Commit the new tags
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::notice::main moved on during the build; its own run sets the tags"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: images ${{ needs.images.outputs.tag }} [skip ci]"
          git push origin HEAD:main
