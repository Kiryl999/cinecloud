[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.4",
    "asyncpg==0.31.0",
    "email-validator==2.3.0",
    "fastapi==0.138.0",
    "greenlet==3.5.2",
    "prometheus-client==0.26.0",
    "prometheus-fastapi-instrumentator==8.1.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pyjwt[crypto]==2.13.0",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "redis==8.1.0",
    "sqlalchemy==2.0.51",
    "sqlmodel==0.0.39",
    "uvicorn==0.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
